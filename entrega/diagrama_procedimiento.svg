<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" width="1120" height="520" font-family="Segoe UI, system-ui, sans-serif">
  <title>Procedimiento en 7 pasos</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#898781"/></marker>
  </defs>
  <rect width="1120" height="520" fill="#fcfcfb"/>
  <text x="40" y="46" font-size="22" font-weight="600" fill="#0b0b0b">Cómo se hizo: 7 pasos de los artículos a la decisión</text>

  <!-- fila 1 -->
  <g>
    <rect x="40" y="80" width="230" height="150" rx="12" fill="#ffffff" stroke="#e1e0d9" stroke-width="2"/>
    <circle cx="76" cy="116" r="18" fill="#2a78d6"/><text x="76" y="122" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">1</text>
    <text x="104" y="122" font-size="18" font-weight="600" fill="#0b0b0b">Probar el acceso</text>
    <text x="60" y="160" font-size="15" fill="#52514e">Europe PMC responde</text>
    <text x="60" y="182" font-size="15" fill="#52514e">(búsqueda y texto completo)</text>
    <text x="60" y="210" font-size="13" fill="#898781">solo artículos de acceso abierto</text>
  </g>
  <g>
    <rect x="310" y="80" width="230" height="150" rx="12" fill="#ffffff" stroke="#e1e0d9" stroke-width="2"/>
    <circle cx="346" cy="116" r="18" fill="#2a78d6"/><text x="346" y="122" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">2</text>
    <text x="374" y="122" font-size="18" font-weight="600" fill="#0b0b0b">Buscar artículos</text>
    <text x="330" y="160" font-size="15" fill="#52514e">7 familias de nanoportadores</text>
    <text x="330" y="182" font-size="15" fill="#52514e">≈ 35.800 artículos 2018–2026</text>
    <text x="330" y="210" font-size="13" fill="#898781">lipídicos, poliméricos, inorgánicos, AAV</text>
  </g>
  <g>
    <rect x="580" y="80" width="230" height="150" rx="12" fill="#ffffff" stroke="#e1e0d9" stroke-width="2"/>
    <circle cx="616" cy="116" r="18" fill="#2a78d6"/><text x="616" y="122" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">3</text>
    <text x="644" y="122" font-size="18" font-weight="600" fill="#0b0b0b">Muestrear al azar</text>
    <text x="600" y="160" font-size="15" fill="#52514e">2.025 artículos en alcance</text>
    <text x="600" y="182" font-size="15" fill="#52514e">por familia, año y licencia</text>
    <text x="600" y="210" font-size="13" fill="#898781">hasta lograr precisión suficiente</text>
  </g>
  <g>
    <rect x="850" y="80" width="230" height="150" rx="12" fill="#ffffff" stroke="#e1e0d9" stroke-width="2"/>
    <circle cx="886" cy="116" r="18" fill="#2a78d6"/><text x="886" y="122" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">4</text>
    <text x="914" y="122" font-size="18" font-weight="600" fill="#0b0b0b">Detectar técnicas</text>
    <text x="870" y="160" font-size="15" fill="#52514e">Lee el texto completo</text>
    <text x="870" y="182" font-size="15" fill="#52514e">por sección y pie de figura</text>
    <text x="870" y="210" font-size="13" fill="#898781">TEM, SEM, DLS, zeta, XRD…</text>
  </g>

  <!-- flechas fila 1 -->
  <path d="M272,155 L306,155" stroke="#898781" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M542,155 L576,155" stroke="#898781" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M812,155 L846,155" stroke="#898781" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <!-- bajada a fila 2 -->
  <path d="M965,232 L965,262 Q965,272 955,272 L165,272 Q155,272 155,282 L155,306" stroke="#898781" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>

  <!-- fila 2 -->
  <g>
    <rect x="40" y="310" width="230" height="150" rx="12" fill="#ffffff" stroke="#e1e0d9" stroke-width="2"/>
    <circle cx="76" cy="346" r="18" fill="#eb6834"/><text x="76" y="352" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">5</text>
    <text x="104" y="352" font-size="18" font-weight="600" fill="#0b0b0b">Validar el detector</text>
    <text x="60" y="390" font-size="15" fill="#52514e">56 artículos revisados</text>
    <text x="60" y="412" font-size="15" fill="#52514e">F1 = 0,97 (provisional)</text>
    <text x="60" y="440" font-size="13" fill="#898781">falta la doble revisión humana</text>
  </g>
  <g>
    <rect x="310" y="310" width="230" height="150" rx="12" fill="#ffffff" stroke="#e1e0d9" stroke-width="2"/>
    <circle cx="346" cy="346" r="18" fill="#2a78d6"/><text x="346" y="352" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">6</text>
    <text x="374" y="352" font-size="18" font-weight="600" fill="#0b0b0b">Calcular co-ocurrencia</text>
    <text x="330" y="390" font-size="15" fill="#52514e">Dado A, ¿cuánto B?  P(B | A)</text>
    <text x="330" y="412" font-size="15" fill="#52514e">con ajuste por familia</text>
    <text x="330" y="440" font-size="13" fill="#898781">intervalos de confianza y FDR 5 %</text>
  </g>
  <g>
    <rect x="580" y="310" width="500" height="150" rx="12" fill="#f4f8fe" stroke="#2a78d6" stroke-width="2"/>
    <circle cx="616" cy="346" r="18" fill="#2a78d6"/><text x="616" y="352" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">7</text>
    <text x="644" y="352" font-size="18" font-weight="600" fill="#0b0b0b">Decidir</text>
    <text x="600" y="392" font-size="15" fill="#52514e">• Qué técnicas capturar en la base</text>
    <text x="600" y="416" font-size="15" fill="#52514e">• Qué pares imagen–espectro son realistas</text>
    <text x="600" y="440" font-size="15" fill="#52514e">• 10 hipótesis contrastadas</text>
  </g>

  <path d="M272,385 L306,385" stroke="#898781" stroke-width="2.5" fill="none" marker-end="url(#ar)" transform="translate(0,0)"/>
  <path d="M542,385 L576,385" stroke="#898781" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <text x="40" y="500" font-size="13" fill="#898781">En naranja: el paso con una limitación pendiente.</text>
</svg>
