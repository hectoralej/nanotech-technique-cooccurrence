rules:
  micrograph: variante + clase de identidad + escala presente + tamano medido (con
    n o sin n); el estado de preparacion esta en la variante
  DLS: variante (z_average|intensity|number|volume|unspecified) + magnitud + identidad
    + medio + temperatura + angulo + dilucion; 'nd' separa
  zeta: metodo (ELS|PALS|unspecified) + identidad + medio + pH (0.5) + fuerza ionica
    + modelo; 'nd' separa
  UVVis: variante (a intrinseca | b cuantificacion | c ensayo | d turbidez) + identidad
  FTIR: variante (ATR|KBr|transmision) + identidad + estado de la muestra
  XRD: variante + identidad + radiacion
  EDS: variante (SEM|TEM|independiente) + identidad
  otras: tecnica + variante + identidad
